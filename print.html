<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhomemoMuma | Receipt printer</title><style>body{font:16px system-ui;max-width:650px;margin:auto;padding:18px;line-height:1.45}button{background:#175dc2;color:#fff;border:0;border-radius:9px;padding:12px 15px;font:inherit;margin:5px 5px 5px 0}button:disabled{opacity:.45}textarea{box-sizing:border-box;width:100%;font:17px system-ui;padding:10px;border-radius:8px}canvas{width:100%;height:auto;border:1px solid #bbb;box-sizing:border-box}pre{background:#18202b;color:#fff;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border-radius:8px}label{display:block;margin:12px 0}input[type=range]{width:70%}</style></head><body><h1>PhomemoMuma</h1><p>Experimental M02 receipt printer for Bluefy</p><button id="connect">Connect M02</button><span id="status">Not connected</span><label for="message">Receipt text</label><textarea id="message" rows="7">Hello from PhomemoMuma!</textarea><label>Text size <select id="size"><option value="20">Small</option><option value="26" selected>Medium</option><option value="34">Large</option></select></label><label>Print darkness (experimental): <strong id="darkval">3</strong> <input id="dark" type="range" min="1" max="5" value="3"></label><p><small>Darkness sends an experimental M02 energy setting. Results depend on paper, battery, and firmware.</small></p><h2>Full receipt preview</h2><canvas id="preview" width="384" height="160"></canvas><p><button id="print" disabled>Print receipt</button><button id="copy">Copy log</button></p><pre id="log">Ready.</pre><script>
const $=id=>document.getElementById(id);let device,write;const log=s=>$('log').textContent+='\n'+s;
function linesFor(ctx,text,width){let result=[];for(const paragraph of text.split(/\n/)){if(!paragraph.trim()){result.push('');continue}let line='';for(const word of paragraph.split(/\s+/)){let candidate=line?line+' '+word:word;if(ctx.measureText(candidate).width>width&&line){result.push(line);line=word}else line=candidate;while(ctx.measureText(line).width>width&&line.length>1){let i=1;while(i<line.length&&ctx.measureText(line.slice(0,i+1)).width<=width)i++;result.push(line.slice(0,i));line=line.slice(i)}}result.push(line)}return result}
function render(){const c=$('preview'),ctx=c.getContext('2d'),size=Number($('size').value);ctx.font='bold '+size+'px sans-serif';const lines=linesFor(ctx,$('message').value,360);const step=Math.ceil(size*1.35),height=Math.max(72,32+lines.length*step+20);if(height>12000){log('Receipt too long for preview');return}c.width=384;c.height=height;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,384,height);x.fillStyle='black';x.font='bold '+size+'px sans-serif';x.textBaseline='top';lines.forEach((line,i)=>x.fillText(line,12,16+i*step));x.fillRect(12,height-18,360,2);$('darkval').textContent=$('dark').value}
$('message').oninput=render;$('size').onchange=render;$('dark').oninput=()=>{$('darkval').textContent=$('dark').value};render();
$('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Open this page in Bluefy');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'Mr.in_'},{namePrefix:'M02'}],optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb']});const server=await device.gatt.connect();write=await(await server.getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb')).getCharacteristic('0000ff02-0000-1000-8000-00805f9b34fb');$('status').textContent='Connected: '+device.name;$('print').disabled=false;device.addEventListener('gattserverdisconnected',()=>{$('status').textContent='Disconnected';$('print').disabled=true});log('Connected to '+device.name)}catch(e){log('Connection error: '+(e?.name||'unknown')+' '+(e?.message||String(e)))}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function send(bytes){for(let i=0;i<bytes.length;i+=20){const chunk=bytes.slice(i,i+20);if(write.writeValueWithoutResponse)await write.writeValueWithoutResponse(chunk);else await write.writeValue(chunk);await sleep(35)}}
$('print').onclick=async()=>{const b=$('print');b.disabled=true;try{render();const c=$('preview'),height=c.height,data=c.getContext('2d').getImageData(0,0,384,height).data;const raster=new Uint8Array(48*height);for(let y=0;y<height;y++)for(let x=0;x<384;x++){const i=(y*384+x)*4;if((data[i]*299+data[i+1]*587+data[i+2]*114)/1000<128)raster[y*48+(x>>3)]|=128>>(x&7)}const darkness=Number($('dark').value);log('Printing '+height+' lines; darkness '+darkness);await send(new Uint8Array([0x1b,0x40,0x1b,0x61,0x00,0x1f,0x11,0x02,0x04]));const energy=[6000,8500,11000,14000,17000][darkness-1];await send(new Uint8Array([0x1f,0x11,0x02,0x04,0x1f,0x11,0x0b,energy&255,(energy>>8)&255]));for(let start=0;start<height;start+=240){const rows=Math.min(240,height-start);await send(new Uint8Array([0x1d,0x76,0x30,0x00,48,0,rows&255,rows>>8]));await send(raster.slice(start*48,(start+rows)*48))}await send(new Uint8Array([0x1b,0x64,0x02,0x1f,0x11,0x08,0x1f,0x11,0x0e,0x1f,0x11,0x07,0x1f,0x11,0x09]));log('Completed. Compare output with preview.')}catch(e){log('Print error: '+(e?.name||'unknown')+' '+(e?.message||String(e)))}finally{b.disabled=!device?.gatt?.connected}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent);log('Copied')}catch(e){log('Copy failed: '+String(e))}};
</script></body></html>
