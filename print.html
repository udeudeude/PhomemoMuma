<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhomemoMuma print test</title><style>body{font:16px system-ui;max-width:620px;margin:auto;padding:20px;line-height:1.45}button{background:#155bc2;color:white;border:0;border-radius:9px;padding:13px;font:inherit;margin:5px 4px 5px 0}button:disabled{opacity:.45}pre{background:#18202b;color:#fff;white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border-radius:9px}canvas{max-width:100%;border:1px solid #aaa}textarea{width:95%;font:18px system-ui;padding:10px}</style></head><body><h1>PhomemoMuma</h1><p>M02 experimental print test, using Bluefy. This sends a short 384-dot raster print to the printer. Turn on the M02 and close the official app first.</p><button id="connect">Connect M02</button><p id="status">Not connected</p><textarea id="message" rows="2">Hello from PhomemoMuma!</textarea><p>Print preview (384 dots wide):</p><canvas id="preview" width="384" height="128"></canvas><p><button id="print" disabled>Print test receipt</button><button id="copy">Copy log</button></p><pre id="log">Ready.</pre><p><a href="./">Bluetooth diagnostic</a></p><script>
const $=x=>document.getElementById(x);let device,write;
const log=s=>$('log').textContent+='\n'+s;
function render(){const c=$('preview'),x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,384,128);x.fillStyle='black';x.font='bold 23px sans-serif';const words=$('message').value.split(/\s+/);let line='',y=36;for(const word of words){const next=line?line+' '+word:word;if(x.measureText(next).width>360&&line){x.fillText(line,12,y);line=word;y+=29}else line=next}if(line&&y<=116)x.fillText(line,12,y);x.fillRect(12,105,360,2)}
$('message').oninput=render;render();
$('connect').onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Web Bluetooth not available. Open in Bluefy.');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'Mr.in_'},{namePrefix:'M02'}],optionalServices:['0000ff00-0000-1000-8000-00805f9b34fb']});log('Selected '+device.name);const server=await device.gatt.connect();const service=await server.getPrimaryService('0000ff00-0000-1000-8000-00805f9b34fb');write=await service.getCharacteristic('0000ff02-0000-1000-8000-00805f9b34fb');$('status').textContent='Connected to '+device.name;$('print').disabled=false;device.addEventListener('gattserverdisconnected',()=>{$('print').disabled=true;$('status').textContent='Disconnected'});log('Ready: FF02 writable')}catch(e){log('ERROR '+e.name+': '+e.message)}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function send(bytes){for(let i=0;i<bytes.length;i+=20){const part=bytes.slice(i,i+20);if(write.writeValueWithoutResponse)await write.writeValueWithoutResponse(part);else await write.writeValue(part);await sleep(35)}}
$('print').onclick=async()=>{const b=$('print');b.disabled=true;try{render();const data=$('preview').getContext('2d').getImageData(0,0,384,128).data;const raster=new Uint8Array(48*128);for(let y=0;y<128;y++)for(let x=0;x<384;x++){const i=(y*384+x)*4;const lum=(data[i]*299+data[i+1]*587+data[i+2]*114)/1000;if(lum<128)raster[y*48+(x>>3)]|=128>>(x&7)}log('Sending 128 lines (6144 raster bytes)...');await send(new Uint8Array([0x1b,0x40,0x1b,0x61,0x00,0x1f,0x11,0x02,0x04]));await send(new Uint8Array([0x1d,0x76,0x30,0x00,48,0,128,0]));await send(raster);await send(new Uint8Array([0x1b,0x64,0x02,0x1b,0x64,0x02,0x1f,0x11,0x08,0x1f,0x11,0x0e,0x1f,0x11,0x07,0x1f,0x11,0x09]));log('Bytes sent. Did the printer print?')}catch(e){log('ERROR '+e.name+': '+e.message)}finally{b.disabled=!device?.gatt?.connected}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent);log('Copied')}catch(e){log(e.message)}};
</script></body></html>
