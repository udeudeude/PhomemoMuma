name: Validate PhomemoMuma
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document-printer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate document app, UI controls and sample PDF
        run: node scripts/check.mjs
